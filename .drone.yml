---
pipeline:
  build:
    image: ubuntu:26.04
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - DAPPER_HOST_ARCH=amd64
    - DOCKER_BUILD_NETWORK=host
    commands:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git make tar
    - curl -fsSL -o /tmp/docker.tgz https://download.docker.com/linux/static/stable/x86_64/docker-29.7.2.tgz
    - echo '803d433f226db4776e1768fd319fc6c6e4935a456acf84fcc0080818b854bc8f  /tmp/docker.tgz' | sha256sum -c -
    - tar xzf /tmp/docker.tgz -C /usr/bin --strip-components=1 docker/docker
    - rm -f /tmp/docker.tgz
    - docker --version
    - make ci
